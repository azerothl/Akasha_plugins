[package]
name = "akasha-matrix-sidecar"
version = "0.1.0"
edition = "2021"
description = "Matrix homeserver sync bridge → Akasha POST /api/message"

[[bin]]
name = "akasha-matrix-sidecar"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
