[package]
name = "akasha-homeassistant-sidecar"
version = "0.1.0"
edition = "2021"
description = "Home Assistant WebSocket events → Akasha automation webhook"

[[bin]]
name = "akasha-homeassistant-sidecar"
path = "src/main.rs"

[dependencies]
futures-util = "0.3"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
url = "2"
